<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="robots" content="noindex">
  <title>Page not found — FreeOrion</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#101f32;--line:#29435e;--text:#eaf3ff;--muted:#a8bdd3;--accent:#63d8ff;--gold:#ffc879}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#193b5c 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(680px,100%);padding:clamp(24px,5vw,48px);background:var(--panel);border:1px solid var(--line);border-radius:16px}
    .code{color:var(--accent);font-size:.85rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.05;margin:.5rem 0 1rem}p{color:var(--muted)}a{display:inline-block;margin:10px 12px 0 0;padding:10px 15px;border:1px solid var(--line);border-radius:8px;color:var(--accent);text-decoration:none;font-weight:700}a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.primary{background:var(--accent);color:#04101d;border-color:var(--accent)}
  </style>
</head>
<body>
  <main>
    <div class="code">Error 404</div>
    <h1>This page is outside the star map.</h1>
    <p>The address may be outdated or the page may have moved. Return to the project homepage or browse the source repository to find the right destination.</p>
    <a class="primary" href="/freeorion/">Back to FreeOrion home</a>
    <a href="https://github.com/ArkansasIo/freeorion">Browse source on GitHub</a>
  </main>
</body>
</html>
