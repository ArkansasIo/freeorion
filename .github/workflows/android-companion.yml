name: FreeOrion Android Companion

on:
  workflow_dispatch:
  push:
    paths:
      - "android-api/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: android-api/server/requirements-dev.txt
      - name: Install API test dependencies
        run: pip install -r android-api/server/requirements-dev.txt
      - name: Run API tests
        working-directory: android-api/server
        run: pytest -q

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android-api/app
        run: |
          gradle --version
          gradle assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: freeorion-android-companion-debug-apk
          path: android-api/app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
